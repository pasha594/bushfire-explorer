name: Build and deploy site
# Builds dist/ with tools/build.mjs and publishes it to GitHub Pages. Only dist/ is published, so the template, build
# script and README stay out of the live site. Pull requests and other branches build only (a check); pushes to main
# also deploy, then tell IndexNow (Bing and other engines, not Google) which pages' text changed.
# Every 15 minutes the same build runs on main to refresh the fire pages: tools/snapshot.mjs reads the NSW and
# Queensland feeds (and the previous log from the live site) before tools/build.mjs writes the pages. GitHub runs
# schedules on a best-effort basis, so runs can start late or be skipped at busy times.
# Requires Settings > Pages > Source: "GitHub Actions".
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *' # off the hour, when fewer scheduled runs are dropped

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.indexnow.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails only if the previous fire log can't be read back from the live site, so a deploy never forgets ended fires.
      - run: node tools/snapshot.mjs
      - run: node tools/build.mjs
      # Compare with the live site before it is replaced; a failure here never blocks the deploy.
      - id: indexnow
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: echo "changed=$(node tools/indexnow.mjs diff | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    if: needs.build.outputs.changed != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit changed pages to IndexNow
        run: echo "${{ needs.build.outputs.changed }}" | tr ' ' '\n' | node tools/indexnow.mjs ping
