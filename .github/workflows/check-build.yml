name: Check generated pages
# The HTML pages are generated by tools/build.mjs and committed. This fails if they are out of date (for example,
# app.js changed but its version hash in the pages didn't, so browsers would keep the old cached copy).
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Generated files are committed
        run: git diff --exit-code || (echo "::error::Run 'node tools/build.mjs' and commit the result." && exit 1)
